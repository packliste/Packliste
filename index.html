<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeScan & Grade Assistent</title>
    <style>
        :root {
            --primary: #e63946;
            --dark: #1d3557;
            --light: #f1faee;
            --grey: #cccccc;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h1 { text-align: center; color: var(--primary); font-size: 24px; margin-top: 0; }
        .instructions { font-size: 14px; color: #555; text-align: center; margin-bottom: 20px; }
        
        /* Kamera-Vorschau */
        .camera-box {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4; /* Typisches Kartenformat */
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Visuelle Schablone für die Karte */
        .overlay {
            position: absolute;
            top: 5%; left: 10%; right: 10%; bottom: 5%;
            border: 3px dashed rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.8);
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* Foto-Vorschauen */
        .preview-zone {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .preview-slot {
            aspect-ratio: 3 / 4;
            background: #e9ecef;
            border: 2px dashed var(--grey);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #777;
            overflow: hidden;
            position: relative;
        }
        .preview-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Controls */
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 10px;
        }
        .btn-capture { background-color: var(--primary); color: white; }
        .btn-capture:hover { background-color: #c5283d; }
        .btn-analyze { background-color: #2a9d8f; color: white; }
        .btn-analyze:disabled { background-color: var(--grey); cursor: not-allowed; }
        
        .status-badge {
            position: absolute;
            top: 5px; left: 5px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>PokéScan Grader</h1>
    <p class="instructions" id="instruction-text">Bitte fotografiere zuerst die <b>Vorderseite</b> deiner Karte.</p>

    <!-- Live Kamera -->
    <div class="camera-box">
        <video id="video" autoplay playsinline></video>
        <div class="overlay" id="camera-overlay">Vorderseite hier ausrichten</div>
    </div>

    <!-- Auslöser -->
    <button class="btn-capture" id="capture-btn">Foto aufnehmen</button>

    <!-- Vorschau der geschossenen Bilder -->
    <div class="preview-zone">
        <div class="preview-slot" id="slot-front">
            <span class="status-badge">Vorderseite</span>
            <span class="placeholder-text">Kein Bild</span>
        </div>
        <div class="preview-slot" id="slot-back">
            <span class="status-badge">Rückseite</span>
            <span class="placeholder-text">Kein Bild</span>
        </div>
    </div>

    <!-- Analyse Button -->
    <button class="btn-analyze" id="analyze-btn" disabled>Karte jetzt prüfen & bewerten</button>
</div>

<!-- Verstecktes Canvas-Element zum Verarbeiten des Bildes -->
<canvas id="canvas" style="display:none;"></canvas>

<script>
    const video = document.getElementById('video');
    const captureBtn = document.getElementById('capture-btn');
    const analyzeBtn = document.getElementById('analyze-btn');
    const canvas = document.getElementById('canvas');
    const overlay = document.getElementById('camera-overlay');
    const instructionText = document.getElementById('instruction-text');

    let images = { front: null, back: null };
    let currentStep = 'front'; // Kann 'front' oder 'back' sein

    // 1. Kamera starten
    async function initCamera() {
        try {
            // "environment" erzwingt auf Handys die Rückkamera
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }, 
                audio: false 
            });
            video.srcObject = stream;
        } catch (err) {
            alert("Kamera-Zugriff verweigert oder nicht unterstützt: " + err.message);
        }
    }

    // 2. Foto aufnehmen
    captureBtn.addEventListener('click', () => {
        const ctx = canvas.getContext('2d');
        // Canvas-Größe an Video anpassen
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // Bild aus dem Video-Stream in Canvas zeichnen
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Als Base64 Daten-URL speichern
        const dataUrl = canvas.toDataURL('image/jpeg');

        if (currentStep === 'front') {
            images.front = dataUrl;
            displayPreview('slot-front', dataUrl);
            
            // Wechsel zu Rückseite
            currentStep = 'back';
            overlay.innerText = "Rückseite hier ausrichten";
            instructionText.innerHTML = "Perfekt! Jetzt bitte die <b>Rückseite</b> fotografieren.";
        } else if (currentStep === 'back') {
            images.back = dataUrl;
            displayPreview('slot-back', dataUrl);
            
            // Beide Bilder vorhanden
            instructionText.innerHTML = "Beide Seiten erfasst! Du kannst die Karte jetzt auswerten lassen.";
            captureBtn.style.display = 'none'; // Kamera-Button verstecken
            analyzeBtn.disabled = false; // Analyse freischalten
        }
    });

    // Hilfsfunktion: Bild in der UI anzeigen
    function displayPreview(slotId, dataUrl) {
        const slot = document.getElementById(slotId);
        const placeholder = slot.querySelector('.placeholder-text');
        if (placeholder) placeholder.remove();

        // Falls schon ein Bild existiert, entfernen
        const oldImg = slot.querySelector('img');
        if (oldImg) oldImg.remove();

        const img = document.createElement('img');
        img.src = dataUrl;
        slot.appendChild(img);
    }

    // 3. Analyse starten (Hier würde später dein API-Call ans Backend sitzen)
    analyzeBtn.addEventListener('click', () => {
        alert("Daten bereit! Die Bilder der Vorder- und Rückseite werden nun an die KI übertragen, um Zustand, Sprache und Cardmarket-Preise (Standort: DE) abzurufen.");
        console.log("Gesendete Daten:", images);
    });

    // Kamera beim Laden direkt starten
    window.addEventListener('DOMContentLoaded', initCamera);
</script>

</body>
</html>
