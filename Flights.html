<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar-Cockpit (Luft & See)</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; max-width: 500px; margin: auto; }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn-group { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size: 14px; }
        
        .btn-fr24 { background: #1a73e8; }
        .btn-adsb { background: #e67e22; }
        .btn-marine { background: #2980b9; }
        .btn-save { background: #27ae60; margin-top: 10px; width: 100%; }
        
        .btn-fav { background: #f39c12; margin: 5px 0; display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 10px; color: white; border: none; border-radius: 8px; font-weight: bold;}
        .btn-del { background: #e74c3c; padding: 5px 10px; font-size: 12px; border-radius: 5px; border: none; color: white; }
        
        h2 { color: #333; margin-top: 0; }
        p { color: #666; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="box">
    <h2>✈️ / 🚢 Radar-Cockpit</h2>
    <input type="text" id="cityInput" placeholder="Ort eingeben (z.B. Mallorca)">
    
    <div class="btn-group">
        <button class="btn-fr24" onclick="openRadar('fr24')">Flightradar24 (Luft)</button>
        <button class="btn-adsb" onclick="openRadar('adsb')">ADS-B Exchange (Luft)</button>
        <button class="btn-marine" onclick="openRadar('marine')">MarineTraffic (See)</button>
    </div>
    
    <button class="btn-save" onclick="saveFavorite()">Ort als Favorit speichern</button>
</div>

<div class="box">
    <h2>⭐ Meine Favoriten</h2>
    <div id="favList"></div>
</div>

<script>
    // Beim Laden: Favoriten rendern und letzten Ort wiederherstellen
    window.onload = function() {
        renderFavorites();
        const lastLocation = localStorage.getItem('lastLocation');
        if (lastLocation) {
            document.getElementById('cityInput').value = lastLocation;
        }
    };

    function openRadar(type) {
        const query = document.getElementById('cityInput').value.trim();
        if (!query) { alert("Bitte einen Ort eingeben"); return; }
        
        // Speichere den Ort als "zuletzt verwendet"
        localStorage.setItem('lastLocation', query);
        
        // Geocode-Suche
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
            .then(r => r.json())
            .then(data => {
                if (data.length > 0) {
                    const lat = data[0].lat;
                    const lon = data[0].lon;
                    let url = "";
                    
                    if (type === 'fr24') url = `https://www.flightradar24.com/${lat},${lon}/11`;
                    else if (type === 'adsb') url = `https://globe.adsbexchange.com/?lat=${lat}&lon=${lon}&zoom=11`;
                    else if (type === 'marine') url = `https://www.marinetraffic.com/en/ais/home/centerx:${lon}/centery:${lat}/zoom:11`;
                    
                    window.open(url, '_blank');
                } else {
                    alert("Ort nicht gefunden.");
                }
            });
    }

    function saveFavorite() {
        const city = document.getElementById('cityInput').value.trim();
        if (!city) return;
        let favs = JSON.parse(localStorage.getItem('radarFavs') || "[]");
        if (!favs.includes(city)) {
            favs.push(city);
            localStorage.setItem('radarFavs', JSON.stringify(favs));
            renderFavorites();
        }
    }

    function renderFavorites() {
        const list = document.getElementById('favList');
        list.innerHTML = "";
        let favs = JSON.parse(localStorage.getItem('radarFavs') || "[]");
        favs.forEach(city => {
            const div = document.createElement('div');
            div.style = "display: flex; gap: 5px; margin-bottom: 5px;";
            div.innerHTML = `
                <button class="btn-fav" onclick="document.getElementById('cityInput').value='${city}';">${city}</button>
                <button class="btn-del" onclick="deleteFavorite('${city}')">X</button>
            `;
            list.appendChild(div);
        });
    }

    function deleteFavorite(city) {
        let favs = JSON.parse(localStorage.getItem('radarFavs') || "[]");
        favs = favs.filter(f => f !== city);
        localStorage.setItem('radarFavs', JSON.stringify(favs));
        renderFavorites();
    }
</script>

</body>
</html>
