<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto & Eurojackpot Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        h1 {
            color: #005b9f;
            text-align: center;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            max-width: 700px;
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }
        .disclaimer {
            background-color: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9em;
            margin-bottom: 25px;
            border-left: 5px solid #c62828;
            text-align: left;
        }
        .generator-section {
            padding: 20px 0;
            border-top: 1px solid #eee;
        }
        .generator-section:first-of-type {
            border-top: none;
        }
        h2 {
            color: #333;
            font-size: 1.5em;
            margin-bottom: 15px;
        }
        .numbers-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .ball {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        /* Farben 6 aus 49 */
        .ball-lotto {
            background: radial-gradient(circle at 15px 15px, #ffd54f, #ffb300);
        }
        .ball-superzahl {
            background: radial-gradient(circle at 15px 15px, #ef5350, #c62828);
            color: white;
        }
        /* Farben Eurojackpot */
        .ball-euro-main {
            background: radial-gradient(circle at 15px 15px, #fff59d, #fbc02d);
        }
        .ball-euro-star {
            background: radial-gradient(circle at 15px 15px, #ffca28, #f57f17);
            border: 2px solid #333;
        }
        button {
            background-color: #005b9f;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #003f72;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Zufalls-Tipp-Generator</h1>
        
        <div class="disclaimer">
            <strong>Wichtiger Hinweis:</strong> Dieser Generator nutzt simulierte "historische Häufigkeiten", um bestimmte Zahlen im Algorithmus zu bevorzugen. Bitte denke daran: Lottokugeln haben kein Gedächtnis. Glücksspiel kann süchtig machen.
        </div>

        <div class="generator-section">
            <h2>Lotto 6 aus 49</h2>
            <button onclick="generateLotto()">6 aus 49 Zahlen generieren</button>
            <div id="lotto-result" class="numbers-container"></div>
            <div id="superzahl-result" class="numbers-container"></div>
        </div>

        <div class="generator-section">
            <h2>Eurojackpot (5 aus 50 + 2 aus 12)</h2>
            <button onclick="generateEurojackpot()">Eurojackpot Zahlen generieren</button>
            <div id="euro-main-result" class="numbers-container"></div>
            <div id="euro-star-result" class="numbers-container"></div>
        </div>
    </div>

    <script>
        // Simulierte Häufigkeiten für Lotto 6 aus 49
        const lottoFreq = {
            1: 45, 2: 50, 3: 42, 4: 55, 5: 48, 6: 60, 7: 40, 8: 47, 9: 52, 10: 49,
            11: 44, 12: 51, 13: 38, 14: 56, 15: 43, 16: 49, 17: 53, 18: 41, 19: 46, 20: 50,
            21: 45, 22: 48, 23: 54, 24: 42, 25: 47, 26: 61, 27: 40, 28: 49, 29: 52, 30: 44,
            31: 58, 32: 43, 33: 50, 34: 45, 35: 48, 36: 41, 37: 47, 38: 55, 39: 42, 40: 49,
            41: 46, 42: 53, 43: 44, 44: 50, 45: 41, 46: 48, 47: 45, 48: 52, 49: 47
        };

        // Simulierte Häufigkeiten für Eurojackpot Hauptzahlen (1-50)
        const euroMainFreq = {};
        for(let i=1; i<=50; i++) {
            euroMainFreq[i] = 40 + Math.floor(Math.random() * 20);
        }
        euroMainFreq[49] = 70; euroMainFreq[20] = 65; euroMainFreq[5] = 30;

        // Simulierte Häufigkeiten für Eurozahlen (1-12)
        const euroStarFreq = {
            1: 55, 2: 50, 3: 60, 4: 45, 5: 65, 6: 48, 7: 52, 8: 58, 9: 47, 10: 50, 11: 42, 12: 51
        };

        // Universelle Funktion zum Ziehen mit Gewichtung
        function getWeightedRandomNumber(availableNumbers, freqMap) {
            let totalWeight = 0;
            availableNumbers.forEach(num => totalWeight += freqMap[num]);

            let randomVal = Math.random() * totalWeight;
            let currentWeight = 0;

            for (let i = 0; i < availableNumbers.length; i++) {
                currentWeight += freqMap[availableNumbers[i]];
                if (randomVal <= currentWeight) {
                    return availableNumbers[i];
                }
            }
            return availableNumbers[availableNumbers.length - 1];
        }

        function drawNumbers(totalNumbers, drawCount, freqMap) {
            let availableNumbers = [];
            for (let i = 1; i <= totalNumbers; i++) {
                availableNumbers.push(i);
            }
            let drawnNumbers = [];
            for (let i = 0; i < drawCount; i++) {
                let picked = getWeightedRandomNumber(availableNumbers, freqMap);
                drawnNumbers.push(picked);
                availableNumbers = availableNumbers.filter(num => num !== picked);
            }
            return drawnNumbers.sort((a, b) => a - b);
        }

        // === 6 aus 49 Generator ===
        function generateLotto() {
            let drawnNumbers = drawNumbers(49, 6, lottoFreq);
            let superzahl = Math.floor(Math.random() * 10);

            const resultDiv = document.getElementById('lotto-result');
            resultDiv.innerHTML = '';
            drawnNumbers.forEach(num => {
                const ball = document.createElement('div');
                ball.className = 'ball ball-lotto';
                ball.textContent = num;
                resultDiv.appendChild(ball);
            });

            const superzahlDiv = document.getElementById('superzahl-result');
            superzahlDiv.innerHTML = `<div class="ball ball-superzahl" title="Superzahl">${superzahl}</div>`;
        }

        // === Eurojackpot Generator ===
        function generateEurojackpot() {
            let mainNumbers = drawNumbers(50, 5, euroMainFreq);
            let euroNumbers = drawNumbers(12, 2, euroStarFreq);

            const mainResultDiv = document.getElementById('euro-main-result');
            mainResultDiv.innerHTML = '';
            mainNumbers.forEach(num => {
                const ball = document.createElement('div');
                ball.className = 'ball ball-euro-main';
                ball.textContent = num;
                mainResultDiv.appendChild(ball);
            });

            const starResultDiv = document.getElementById('euro-star-result');
            starResultDiv.innerHTML = '';
            euroNumbers.forEach(num => {
                const ball = document.createElement('div');
                ball.className = 'ball ball-euro-star';
                ball.textContent = num;
                ball.title = "Eurozahl";
                starResultDiv.appendChild(ball);
            });
        }

        // Direkt beim Laden einmal für beide Felder Zahlen generieren
        window.onload = () => {
            generateLotto();
            generateEurojackpot();
        };
    </script>
</body>
</html>
